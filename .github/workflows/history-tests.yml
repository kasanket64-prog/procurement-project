name: Procurement regression tests

on:
  push:
    branches:
      - test/point-in-time-history-regression
  pull_request:
    paths:
      - "ml/procurement_history.py"
      - "ml/procurement_ai.py"
      - "ml/procurement_search.py"
      - "ml/procurement_risk.py"
      - "ml/procurement_platform.py"
      - "ml/procurement_platform_template.html"
      - "ml/supplier_matcher.py"
      - "tests/**"
      - ".github/workflows/history-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install regression test dependencies
        run: python -m pip install numpy pandas scikit-learn joblib
      - name: Run procurement regression tests
        run: python -m unittest discover -s tests -p "test_procurement_history.py" -v && python -m unittest discover -s tests -p "test_what_if.py" -v && python -m unittest discover -s tests -p "test_demo_ranking.py" -v

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser test dependency
        run: python -m pip install playwright
      - name: Install Chromium for headless checks
        run: python -m playwright install --with-deps chromium
      - name: Run browser What-If and RFQ smoke tests
        run: python -m unittest discover -s tests -p "test_browser_platform.py" -v
