name: Point-in-time history regression tests

on:
  push:
    branches:
      - test/point-in-time-history-regression
  pull_request:
    paths:
      - "ml/procurement_history.py"
      - "tests/test_procurement_history.py"
      - ".github/workflows/history-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-terminal.txt
      - name: Install test dependencies
        run: python -m pip install numpy pandas
      - name: Run point-in-time history regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
