name: Procurement regression tests

on:
  push:
    branches:
      - test/point-in-time-history-regression
  pull_request:
    paths:
      - "ml/procurement_history.py"
      - "ml/procurement_ai.py"
      - "ml/procurement_search.py"
      - "ml/procurement_risk.py"
      - "tests/**"
      - ".github/workflows/history-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install regression test dependencies
        run: python -m pip install numpy pandas scikit-learn joblib
      - name: Run procurement regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
